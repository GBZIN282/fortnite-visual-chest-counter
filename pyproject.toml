[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fortnite-visual-chest-counter"
dynamic = ["version"]
description = "Visual chest detection for OBS, capture cards & video files (Fortnite). Not affiliated with Epic Games."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller", "matplotlib", "librosa", "soundfile"]

[project.scripts]
fortnite-chest-counter = "fortnite_chest_counter.counter:main"

[tool.setuptools.dynamic]
version = { attr = "fortnite_chest_counter.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortnite_chest_counter = ["templates/**/*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
