[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fortnite-visual-chest-counter"
dynamic = ["version"]
description = "Visual chest detection for OBS, capture cards & video files (Fortnite). Not affiliated with Epic Games."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "scipy", "streamlink>=8.6"]   # streamlink: livestream URL input (v0.2.1)

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8"]                      # the desktop app (v0.2.0+)
dev = ["pytest", "PySide6-Essentials>=6.8", "pefile", "pillow", "matplotlib", "librosa", "soundfile"]

[project.scripts]
fortnite-chest-counter = "fortnite_chest_counter.counter:main"

[project.gui-scripts]
fortnite-chest-counter-app = "fortnite_chest_counter.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "fortnite_chest_counter.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fortnite_chest_counter = ["templates/**/*.npy", "gui/assets/*.png", "gui/assets/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
