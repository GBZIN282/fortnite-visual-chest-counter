# Fortnite Visual Chest Counter - OPTIONAL settings
# ------------------------------------------------------------------------------------------
# You do NOT need this file. Without it the program uses the defaults shown here.
# To change something: copy this file, rename the copy to  config.toml  (same folder as the
# program), edit it with Notepad, save, and start the counter again.
# Anything you leave out keeps its default. A typo shows a warning and uses the default.
# Lines starting with # are comments.

[detector]
# Which languages Fortnite is set to. "en" = English (CHEST), "pt" = Portuguese (BAU).
# Using only your language gives slightly fewer false alarms:  languages = ["en"]
languages = ["en", "pt"]

# How many frames per second are analysed (5-30). 15 is what the detector was tested at.
process_fps = 15

# Which strong detections go into the CERTAIN count:
#   "HIGH"    = high and very-high confidence (default)
#   "CERTAIN" = only the very-high ones (stricter; CERTAIN will be lower)
# Either way, every certain chest is also included in APPROX.
certain_min_tier = "HIGH"

# APPROX is the estimated TOTAL (it already includes the certain chests). These switches
# decide which weaker evidence is allowed to add to APPROX only.
count_supported_medium_as_approx = true     # medium popup + the "open chest" button + a chest-looking object
count_interaction_object_as_approx = true   # button + chest-looking object, even if the popup was missed
medium_counts_alone_languages = ["en"]      # languages whose medium-confidence popup counts by itself

[display]
# What your viewers see. EASIEST: double-click "Configure Counter.bat" - it asks two questions and writes these lines for you.
# The counter only writes TEXT FILES (in the obs_output folder); OBS shows them with a "Text (GDI+)" source that has
# "Read from file" ticked. Fonts, colours and size are set in OBS, not here.
#
# The two numbers:
#   CERTAIN = chests detected with strong evidence
#   APPROX  = the estimated TOTAL, which already INCLUDES the certain ones (never add them together)
#
# Use ONE file in OBS: obs_output\chest_counter.txt - every display choice below is written there, so you never change
# the OBS source. (Other files, for advanced layouts with separately styled sources: certain_chests.txt = always the
# certain_text, approximate_chests.txt = always the approx_text, chest_status.txt = legacy one-line file,
# last_chest.txt = the most recent chest.)

# What chest_counter.txt shows:
#   show = "approx"                              -> only approx_text  (the estimated total)
#   show = "certain"                             -> only certain_text
#   show = "both" and both_layout = "stacked"    -> certain_text on the first line, approx_text on the second
#   show = "both" and both_layout = "inline"     -> one line: combined_status_format
show = "both"
both_layout = "stacked"

# Your own wording. {count} is where the number goes. You may also use {certain} and {approx} anywhere.
# Any text, symbols and emoji are fine (whether emoji display depends on the font you pick in OBS).
# For a literal { or } write {{ or }}.   For a second line inside one text, write \n
# Examples:
#   approx_text = "Chests opened: {count}"
#   approx_text = "Chest Hunt: {count}/500"
#   certain_text = "Confirmed: {count}"
certain_text = "CERTAIN OPENED CHESTS: {count}"
approx_text = "APPROX. OPENED CHESTS: {count}"

# The one-line text (show = "both" + both_layout = "inline"). Placeholders: {certain} and {approx}
combined_status_format = "{certain} certain • ~{approximate} estimated"

# true -> 1,232      false -> 1232
use_thousands_separator = true

[console]
# The black counter window (not what viewers see).
#   "minimal" -> only chests that were counted, plus warnings and errors
#   "normal"  -> also pop-ups that were NOT counted (red) and a status line every few seconds
#   "debug"   -> everything, with the full reason for each decision (useful when reporting a problem)
verbosity = "normal"
# Coloured lines: green = certain chest, yellow = approx-only chest, red = not counted, white-on-red = error.
# Set to false for plain text.
colors = true

[state]
# Keep the counts when the program is closed and reopened.
persist = true
path = "state/chest_state.json"
# Folder where the OBS text files are written.
obs_dir = "obs_output"

[logging]
enabled = true
# Also record detections that were NOT counted (useful when reporting a problem).
log_candidates = true
# Save a small picture of the pop-up area for every pop-up the counter considered (counted or not) into
# logs/snapshots/. Turn on if you want to report missed or wrong chests: the pictures show exactly what it saw.
save_snapshots = false
dir = "logs"

[live]
# Where the video comes from:
#   "obs-camera" = OBS Virtual Camera (recommended; single PC and dual PC)
#   "device"     = a capture card opened directly (advanced; set "device" below)
#   "desktop"    = capture a monitor (fallback, easily disturbed by other windows)
source = "obs-camera"
# Only for source = "device": the exact device name (Diagnostics.bat lists the names).
device = "OBS Virtual Camera"
# Only for source = "desktop": which monitor (1 = the first).
monitor = 1
# How often the status line is printed, in seconds.
status_interval_seconds = 5
